name: CodeQL config

paths-ignore:
  - vendor
  - tls1274

# go/log-injection flags every log/slog call that has a client's value in it,
# but slog's built-in text and JSON handlers, the only ones howsmyssl uses,
# quote and escape those values. So we turn the stock query off and run our
# copy of it, which is the same but for slog's calls. See
# queries/LogInjectionOutsideSlog.ql for why and for what a hand-written slog
# handler would mean for it.
#
# The query suite is named here and not in the workflow's "queries" input
# because that input replaces this list instead of adding to it.
queries:
  - uses: security-and-quality
  - uses: ./.github/codeql/queries/LogInjectionOutsideSlog.ql

query-filters:
  - exclude:
      id: go/log-injection
